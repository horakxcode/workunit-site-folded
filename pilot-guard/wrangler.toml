name = "workunit-pilot-guard"
main = "worker.js"
compatibility_date = "2026-10-01"

# The custom domain is on the new portal, but its DNS record still points at the old host.
# This route answers portal.workunitlabs.com from the new engine until that record is updated.
[[routes]]
pattern = "portal.workunitlabs.com/*"
zone_name = "workunitlabs.com"
